[package]
name = "xsar"
version = "0.2.0"
edition = "2021"
rust-version = "1.101.0"
authors = ["Charlie <info@xsar.com.au>"]
description = "Autonomous drone swarm mesh architecture and telemetry orchestration."
license = "AGPL-3.0-or-later"
repository = "https://github.com/xsar-research/xsar"
readme = "README.md"
keywords = ["drone", "swarm", "mesh", "telemetry", "TERCOM"]
categories = ["embedded", "network-programming"]

[features]
default = []
qmp = ["dep:serde_json", "dep:thiserror"]
image_matching = []
png = ["image_matching", "dep:image", "dep:thiserror"]

[dependencies]
serde_json = { version = "1.0.151", optional = true }
thiserror = { version = "2.0.21", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }

[package.metadata.docs.rs]
all-features = true
