[package]
name = "xsar"
version = "0.9.1"
edition = "2024"
rust-version = "1.101.0"
authors = ["Charlie <info@xsar.com.au>"]
description = "Autonomous drone swarm mesh architecture and telemetry orchestration."
license = "AGPL-3.0-or-later"
repository = "https://github.com/xsar-research/xsar"
readme = "README.md"
keywords = ["drone", "swarm", "mesh", "telemetry", "TERCOM"]
categories = ["embedded", "network-programming"]

[features]
default = []
search = []
execution = []
pyramid_rules = ["pyramid", "dep:thiserror"]
pyramid_search = ["pyramid_rules", "search"]
qmp = ["dep:serde_json", "dep:thiserror"]
image_matching = []
png = ["image_matching", "dep:image", "dep:thiserror"]
cards = []
pyramid = ["cards"]
pyramid_json = ["pyramid", "dep:serde", "dep:serde_json"]
pixel_format = []
tcp_capture = ["pixel_format"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", optional = true }
thiserror = { version = "2.0.21", optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "packed-byte-comparison"
required-features = ["image_matching"]
